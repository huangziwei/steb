[package]
name = "steb-native"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[lib]
name = "steb_native"
path = "src/lib.rs"

[[bin]]
name = "steb-native"
path = "src/main.rs"

[dependencies]
# Raw open/ioctl for the framebuffer and evdev touch/button devices.
libc = "0.2"
# Error propagation with context strings in the run loop.
anyhow = "1"
# Sync HTTP client over HTTPS. `rustls-no-provider` leaves the crypto provider
# to `rustls-rustcrypto` below.
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
    "gzip",
] }
# No provider features of its own. `tls12` off.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# The crypto provider behind `rustls-no-provider`, pinned to git.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "7b44a2de957b6596d267a920d3aec0d4137defb1" }
# Bundled Mozilla root store.
webpki-roots = "1"
# The catalogue cache: book records keyed by path.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TTF rasterizer over the Kindle's bundled faces, outlining a glyph on demand.
ab_glyph = "0.2"
# Cover JPEG/PNG decode and resize for the grid.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# X11 client over the socket. `allow-unsafe-code` links the system libxcb.
x11rb = { version = "0.13", default-features = false }
