# Workspace cargo config.
#
# Target-specific only — keeps host (macOS) builds untouched and only kicks in
# when cross-compiling to the Kindle.
#
# Build the on-device binary with ./build.sh, which needs no host setup.
#
# armv7-unknown-linux-musleabihf covers the whole fleet: the KOA2's Cortex-A9
# and the newer MediaTek devices (Colorsoft, Scribe), which still run a 32-bit
# armv7 userspace. musl = static link, so the binary is firmware-agnostic.
#
# Linker: rustc's bundled rust-lld via `link-self-contained=yes`. This is the
# pure-Rust cross path — no zig, no GNU cross-binutils. It holds as long as no
# crate in the graph has a C build-script, which is why every dependency in
# native/Cargo.toml is pure Rust (rustls rather than native-tls especially).
# If that ever changes, the fallback is `cargo install cargo-zigbuild`.
#
# `linker` below is a BARE NAME, so cargo resolves it through PATH — and rust-lld
# is not on PATH. It ships inside the toolchain at
# `$(rustc --print sysroot)/lib/rustlib/<host-triple>/bin/rust-lld`, whose host
# triple differs between Intel and Apple Silicon, and TOML has no command
# substitution to resolve it here.
#
# build.sh closes that gap: it derives the absolute path and exports
# CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER, which overrides this key.
# Use it and nothing else is needed.
#
# The bare name is what a DIRECT `cargo build --target armv7-…` falls back to, and
# that invocation still fails without a `rust-lld` on PATH. Export the same env
# var for a one-off rather than symlinking into ~/.cargo/bin: a symlink is a
# global mutation to make one repo build, it needs redoing whenever a
# `rustup update` reshuffles the bundled tools, and it is unavailable when the
# home directory is not writable.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
