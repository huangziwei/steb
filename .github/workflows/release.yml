# Publish a release on GitHub, get the install tree attached to it.
#
#   Releases -> Draft a new release -> tag v0.1.0 -> Publish
#
# **Publishing is what starts this, not the tag.** The release is written by
# hand and this only ever adds files to one that already exists, so a tag pushed
# on its own builds nothing and a draft waits until it is published. Assets are
# replaced rather than added to, which is what makes a failed run safe to re-run
# from the Actions tab without touching the release.
#
# The tag has to match [workspace.package] in Cargo.toml; the job stops if it
# does not. That version is compiled in as CARGO_PKG_VERSION and is what the
# startup line in /mnt/us/logs/steb.log and the HTTP user agent both report, so
# a release whose name disagrees with it cannot be traced from either end.
#
# Nothing about the build is CI-specific. One armv7 musl target covers the whole
# fleet and the cross link goes through rustc's own bundled rust-lld, so a
# runner needs the target and nothing else — no sysroot, no C toolchain. build.sh
# is the same script a workstation runs. The zip is not part of that tree and is
# made here alone: locally device/ is what gets dragged over USB, and an archive
# of it would be a build product nobody opens.

name: Release

on:
    release:
        types: [published]
    # For a dry run on a branch: builds, and attaches nothing to anything.
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Read the version the way build.sh reads it — section-aware, so it
            # is the [workspace.package] key being compared and not some other
            # `version =` that grows into the file later.
            - name: Check the tag against Cargo.toml
              if: github.event_name == 'release'
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  crate=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0}
                               f && /^version *=/{gsub(/[" ]/,""); sub(/^version=/,""); print; exit}' \
                      Cargo.toml)
                  if [ "$crate" != "${TAG#v}" ]; then
                    echo "error: release $TAG does not match Cargo.toml $crate" >&2
                    exit 1
                  fi
                  echo "version $crate"

            # build.sh stops before it starts if this is missing, rather than
            # letting cargo fail on a missing core.
            - name: Install the cross target
              run: rustup target add armv7-unknown-linux-musleabihf

            # rustls-rustcrypto is pinned to a git rev, so ~/.cargo/git carries
            # as much weight here as the registry does.
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

            # Host build. The live tests are #[ignore] by default and stay that
            # way here: cutting a release is no reason to put load on
            # standardebooks.org.
            - name: Format, lint, test
              run: |
                  cargo fmt --all --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace

            - name: Build the device tree
              run: ./build.sh

            - name: Package
              id: package
              env:
                  VERSION: ${{ github.event.release.tag_name || github.ref_name }}
              run: |
                  # One asset, not one per model: the build is not told which
                  # Kindle it is for, so there is nothing to name it after. The
                  # slash is squashed so a dry run from a branch like feat/x
                  # still names a file rather than a missing directory.
                  name="steb-$(echo "$VERSION" | tr / -)-kindle"
                  # Zipped from inside device/ so the archive opens onto
                  # extensions/ and documents/, which are what go to /mnt/us.
                  # assets/ and make-tile.sh stay behind — they build the tile's
                  # embedded icon and have no place on the device. .DS_Store is
                  # dropped because device/ is a tree people open in Finder.
                  (cd device && zip -qr "$RUNNER_TEMP/$name.zip" extensions documents -x '*.DS_Store')
                  # GPLv3 conveys the license with the object code, so it rides
                  # along at the archive root rather than on the device: whoever
                  # unzips this has it, and /mnt/us stays as it was.
                  zip -q "$RUNNER_TEMP/$name.zip" LICENSE
                  # Written from inside $RUNNER_TEMP so the sidecar names the
                  # zip alone and `sha256sum -c` works where the two land.
                  (cd "$RUNNER_TEMP" && sha256sum "$name.zip" > "$name.zip.sha256")
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  ls -lh "$RUNNER_TEMP/$name.zip"

            # `--clobber` replaces an asset of the same name instead of refusing
            # it, so re-running after a failure lands the same two files rather
            # than needing the release taken apart first.
            - name: Attach to the release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ steps.package.outputs.name }}
              run: |
                  gh release upload "$TAG" \
                    "$RUNNER_TEMP/$NAME.zip" \
                    "$RUNNER_TEMP/$NAME.zip.sha256" \
                    --clobber

            - name: Keep the tree from a manual run
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: |
                      device/extensions
                      device/documents
